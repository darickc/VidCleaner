# Shipped default GLOBAL whitelist seeds. Unlike never_match these words DO
# match; they are recorded as detections with whitelisted=1, muted=0 when the
# context is present, so the review UI can show and undo them.
default_whitelist:
  - {canonical: spic, context_text: "spic and span"}
  - {canonical: chink, context_text: "chink in"}
  - {canonical: cum, context_text: "cum laude"}
  - {canonical: tit, context_text: "tit for tat"}
  - {canonical: hooker, context_text: "hooker and"}
