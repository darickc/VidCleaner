  - c-section
  - q-tip
  - v-sign
  - o-ring
  - co-op
  - re-elect
  - wi-fi
  - hi-fi
  - sci-fi
  # Words the letters-and-length censored rule could otherwise reach for, and
  # near-misses the fuzzy timing selector must never pick.
  - f-bomb
  - f-word
  - s-word
  - c-word
  - n-word
  - shirt
  - shirts
  - sheet
