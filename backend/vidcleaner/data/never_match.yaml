# What this file is actually for.
#
# PLAN.md §7 attributes it to the Scunthorpe problem, but that turns out to be
# handled entirely by the compiler: `(?<!\w)(?:...)(?!\w)` boundaries plus
# explicit `compounds` entries already reject Scunthorpe, assassin, class,
# classic, bass, cassette, shell, cocktail, hello, Uranus and shiitake with zero
# help from this file. (Verified; see test_never_match.py, which asserts it.)
#
# It is load-bearing for the two paths that are NOT boundary-anchored:
#
#   1. normalize.detect_censored()'s hyphen branch. `f-ing` is a shape
#      heuristic -- one letter, a hyphen, a short tail -- and `x-ray`, `e-mail`,
#      `t-shirt`, `a-list`, `u-turn` have exactly that shape. No regex trick
#      fixes this; only a list does.
#   2. detect.py's rapidfuzz timing selector. ratio("shit","shirt") = 88.9 and
#      ratio("damn","dam") = 85.7 both clear the >= 85 bar, so a never_match
#      token must never be chosen as the timing token for a subtitle hit.
version: 1

# Runtime, load-bearing. Compared against the FOLDED token (lowercased,
# apostrophes and hyphens removed), so list entries are folded on load too.
never_match:
  # Letter-hyphen compounds that look like `f-ing` to the censored detector.
  - x-ray
  - e-mail
  - t-shirt
  - a-list
  - b-side
  - u-turn
  - d-day
  - v-neck
  - x-men
  - g-string
  - h-bomb
