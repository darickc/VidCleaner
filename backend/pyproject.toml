[project]
name = "vidcleaner"
version = "0.1.0"
description = "Mute profanity in a Jellyfin library managed by Sonarr/Radarr"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "pysubs2>=1.7",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "cryptography>=44.0",
]

# Speech-to-text stack. Not installed by default: it pulls torch (~2 GB) and is
# unused until M1. Install with `uv sync --extra stt`.
[project.optional-dependencies]
stt = [
    "faster-whisper>=1.1",
    "whisperx>=3.3",
]

[project.scripts]
vidcleaner = "vidcleaner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vidcleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; leave the generated formatting alone.
"vidcleaner/db/alembic/versions/*" = ["E501"]
