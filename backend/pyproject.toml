[project]
name = "vidcleaner"
version = "0.1.0"
description = "Mute profanity in a Jellyfin library managed by Sonarr/Radarr"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "pysubs2>=1.7",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "cryptography>=44.0",
]

# Speech-to-text stack. Not installed by default: it pulls torch (~2 GB).
# Install with `uv sync --extra stt`.
[project.optional-dependencies]
stt = [
    "faster-whisper>=1.1",
    "whisperx>=3.3",
    # torch/torchaudio arrive transitively via whisperx, but `[tool.uv.sources]`
    # only applies to *direct* dependencies -- so they are named here in order
    # to pin the CPU wheel index below.
    "torch>=2.4",
    "torchaudio>=2.4",
]

# PLAN.md §10 requires CPU-only torch. Resolved from PyPI, torch drags the whole
# nvidia-*-cu12 wheel set on amd64 Linux -- roughly +2.5 GB in an image whose
# target is ~3 GB total -- for a design that never touches CUDA.
#
# The marker matters: the PyTorch CPU index carries no macOS wheels, so pinning
# it unconditionally would make the lock unresolvable on an arm64 Mac. macOS
# builds have no CUDA variant to avoid anyway.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[project.scripts]
vidcleaner = "vidcleaner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vidcleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ffmpeg: needs a working ffmpeg/ffprobe >= 7.0 (auto-applied to tests/integration/)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; leave the generated formatting alone.
"vidcleaner/db/alembic/versions/*" = ["E501"]
