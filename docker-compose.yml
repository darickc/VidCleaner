services:
  vidcleaner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vidcleaner:latest
    container_name: vidcleaner
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      # unraid's nobody:users. Match whatever owns your media share.
      PUID: "99"
      PGID: "100"
      TZ: "America/Denver"
      # 0002 keeps the group bit so the arrs can still manage what we write.
      UMASK: "0002"
      VIDCLEANER_ROLE: "all"
      VIDCLEANER_LOG_LEVEL: "INFO"
      # Inside /media, so the swap is a rename rather than a copy-and-delete.
      VIDCLEANER_BACKUPS_DIR: "/media/.vidcleaner-backups"
      # CTranslate2/OMP threads. Leave it unset and the entrypoint uses `nproc - 2`
      # (PLAN.md §4); set it only to override that. Note it must be set *here* rather
      # than in the UI, because libgomp reads it once at process start -- the UI's
      # "CPU threads" then moves both halves of the pipeline together.
      # OMP_NUM_THREADS: "6"
    volumes:
      - ${CONFIG_DIR:-./.docker/config}:/config
      # Must be the SAME path Sonarr/Radarr/Jellyfin use (PLAN.md §2).
      - ${MEDIA_DIR:-/mnt/user/media}:/media
      # Scratch; put this on an SSD/cache pool.
      - ${WORK_DIR:-./.docker/work}:/work
      # NOTE there is deliberately no /backups mount. Originals go to
      # VIDCLEANER_BACKUPS_DIR below, which is a path *inside* /media -- `rename(2)`
      # returns EXDEV across two mount points even when both are the same
      # filesystem, so a separate volume could never be the same-filesystem rename
      # §10 requires. Measured, not assumed: see the Decision Log.
